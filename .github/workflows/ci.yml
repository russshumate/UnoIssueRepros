name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (desktop + WebAssembly)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Build the desktop head
        run: dotnet build UnoIssueRepros/UnoIssueRepros.csproj -f net10.0-desktop -c Release

      - name: Build the WebAssembly head
        run: dotnet build UnoIssueRepros/UnoIssueRepros.csproj -f net10.0-browserwasm -c Release
